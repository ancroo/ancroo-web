name: Build Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. The build job runs `pnpm install` over the whole npm
# dependency tree, so it must not hold a token that can write to the repo.
# Only the release job widens this, and only for itself.
permissions:
  contents: read

# Every action is pinned to a commit SHA: a tag like @v6 is mutable and would
# silently move if the action's repo were taken over. The trailing comment names
# the release each SHA belongs to; Dependabot keeps both up to date.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: vite.config.ts derives the version from `git describe`.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Tag builds are what ships to the store, so they install from a clean
      # store instead of restoring a cache some earlier run wrote.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informational: an advisory in a dev dependency without a fix must not
      # block every build, but it should show up as a warning, not vanish.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build extension
        run: pnpm build

      # The manifest version comes from `git describe`, not from manifest.json.
      # A tag that is not exactly vX.Y.Z builds as 0.0.0 — catch that before
      # anything is released or uploaded.
      - name: Check tag matches built manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT="$(jq -r '.version' dist/manifest.json)"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::tag v$TAG does not match the built manifest version $BUILT"
            exit 1
          fi

      - name: Create ZIP archive
        run: cd dist && zip -9 -r ../ancroo-web-extension.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ancroo-web-extension
          path: ancroo-web-extension.zip
          retention-days: 30

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The only job that may write to the repo, and only on a tag.
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ancroo-web-extension
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ancroo-web-extension.zip
          generate_release_notes: true
          body: |
            ## Download

            | File | Description |
            |------|-------------|
            | `ancroo-web-extension.zip` | Chrome/Edge extension (Manifest V3) |

            ## Installation

            1. Download `ancroo-web-extension.zip`
            2. Extract to a folder
            3. Open Chrome → `chrome://extensions/`
            4. Enable **Developer mode** (top right)
            5. Click **Load unpacked** → select the extracted folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The CWS_* secrets live in this environment, not in the repo, so no other
    # workflow and no other job in this one can read them. Restrict the
    # environment to the "v*" tags in the repo settings (Settings →
    # Environments → store → deployment branches and tags). See RELEASING.md.
    environment: store
    # Needs no write access of its own: the release is already cut, and the
    # store upload authenticates against Google, not GitHub.
    permissions:
      contents: read
    steps:
      # Sparse: only the token helper, not the whole tree.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ancroo-web-extension
          path: .

      # Straight against the store's REST API with curl. The official CLI would
      # pull chrome-webstore-upload-cli plus its entire unpinned dependency tree
      # into the one job that holds the store credentials — the exact path the
      # 2025 npm worms used to read secrets out of the environment. curl and jq
      # ship with the runner and need no install step.
      #
      # Uploads a new draft only — publishing stays a manual click in the
      # dashboard. Add a publish call against .../items/<id>/publish to skip it.
      - name: Upload to Chrome Web Store
        env:
          # The item id is public (store URL, README, About panel), so it is a
          # variable. The secret fallback keeps releases working until it has
          # been moved; drop it once the repo secret is deleted.
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID || secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ZIP: ancroo-web-extension.zip
        run: |
          set -euo pipefail

          if [ -z "${EXTENSION_ID:-}" ]; then
            echo "::error::CWS_EXTENSION_ID is not set."
            exit 1
          fi
          [ -f "$ZIP" ] || { echo "::error::$ZIP not found in the downloaded artifact."; exit 1; }

          # A stray newline in the id would otherwise end up inside the upload URL.
          EXTENSION_ID="$(printf '%s' "$EXTENSION_ID" | tr -d '[:space:]')"

          ACCESS_TOKEN="$(.github/scripts/cws-token.sh)"

          RESPONSE="$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T "$ZIP" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}")"

          if printf '%s' "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::Upload rejected: $(printf '%s' "$RESPONSE" | jq -r '.error.message // .error')"
            exit 1
          fi

          STATE="$(printf '%s' "$RESPONSE" | jq -r '.uploadState // empty')"
          if [ "$STATE" != "SUCCESS" ]; then
            echo "::error::Upload finished with uploadState=${STATE:-none} (expected SUCCESS)."
            printf '%s' "$RESPONSE" | jq -r '.itemError[]? | "::error::\(.error_code): \(.error_detail)"'
            exit 1
          fi

          echo "Uploaded $ZIP as a new draft. Publish it by hand in the developer dashboard."
