name: Verify Store Credentials

# Read-only check that the four CWS_* secrets still work: exchanges the refresh
# token for an access token and reads the item's status from the Chrome Web
# Store API. It uploads nothing and publishes nothing, so it is safe to run at
# any time — e.g. before cutting a release tag, or after rotating a credential.
on:
  workflow_dispatch:

permissions:
  contents: read # only so the checkout below can fetch the helper script

jobs:
  verify:
    runs-on: ubuntu-latest
    # Same environment as the publish job: the CWS_* secrets are reachable from
    # nowhere else. Manual runs of this workflow may need an approval if the
    # environment has one.
    environment: store
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Exchange refresh token for an access token
        id: token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(.github/scripts/cws-token.sh)"
          echo "token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Read item status from the Chrome Web Store API
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -z "${EXTENSION_ID:-}" ]; then
            echo "::error::CWS_EXTENSION_ID is not set."
            exit 1
          fi

          # An id with a trailing newline lands inside the request URL and the
          # store answers NOT_FOUND — indistinguishable from a wrong account.
          RAW_ID="$EXTENSION_ID"
          EXTENSION_ID="$(printf '%s' "$RAW_ID" | tr -d '[:space:]')"
          if [ "${#RAW_ID}" -ne "${#EXTENSION_ID}" ]; then
            echo "::warning::CWS_EXTENSION_ID contained whitespace (${#RAW_ID} chars vs ${#EXTENSION_ID} trimmed) — re-set it without the newline."
          fi
          # Not a secret: it is in the store URL, the README and the About
          # panel. Kept as a variable so a wrong id is visible in the log
          # instead of hiding behind a mask.
          echo "Looking up item: $EXTENSION_ID (${#EXTENSION_ID} characters)"

          # What can this token actually do? Scope and audience are not secret,
          # and they separate "wrong account" from "wrong scope" at a glance.
          INFO="$(curl -sS "https://oauth2.googleapis.com/tokeninfo?access_token=${ACCESS_TOKEN}")"
          echo "Token scopes:   $(printf '%s' "$INFO" | jq -r '.scope // "unknown"')"
          echo "Token audience: $(printf '%s' "$INFO" | jq -r '.aud // "unknown"')"

          # -w captures the status code: a 403 for a disabled API and a 200
          # with an empty result are otherwise indistinguishable in the body.
          BODY_AND_CODE="$(curl -sS -w $'\n%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}?projection=DRAFT")"
          HTTP_CODE="$(printf '%s' "$BODY_AND_CODE" | tail -n1)"
          RESPONSE="$(printf '%s' "$BODY_AND_CODE" | sed '$d')"

          echo "HTTP $HTTP_CODE"
          echo "Response: $RESPONSE"

          if printf '%s' "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::Item lookup failed: $(printf '%s' "$RESPONSE" | jq -r '.error.message // .error')"
            exit 1
          fi

          # uploadState describes the LAST UPLOAD, not whether the item exists:
          # an extension whose current version is published and that has no
          # pending draft reports NOT_FOUND here, which is entirely normal.
          # What proves the credentials work is the store returning the item
          # at all — id and crxVersion come back only to an account that may
          # see it.
          RETURNED_ID="$(printf '%s' "$RESPONSE" | jq -r '.id // empty')"
          STATE="$(printf '%s' "$RESPONSE" | jq -r '.uploadState // "none"')"

          if [ "$RETURNED_ID" != "$EXTENSION_ID" ]; then
            echo "::error::The store did not return this item (got id '${RETURNED_ID:-none}')."
            echo "::error::Either CWS_EXTENSION_ID is wrong, or the refresh token was granted by an account that cannot see this extension."
            printf '%s' "$RESPONSE" | jq -r '.itemError[]? | "::error::\(.error_code): \(.error_detail)"'
            exit 1
          fi

          echo "Item lookup OK — the store returned this item to the authorised account."
          echo "  published crx version: $(printf '%s' "$RESPONSE" | jq -r '.crxVersion // "unknown"')"
          echo "  uploadState:           $STATE (state of the last upload; NOT_FOUND simply means no draft is pending)"
          echo "All four CWS credentials are valid; a release tag would be able to upload a draft."
