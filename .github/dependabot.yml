version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only propose releases that are at least a week old: hijacked packages
    # are usually caught and pulled within days, so the delay keeps them out.
    # Security updates ignore the cooldown and still arrive immediately.
    cooldown:
      default-days: 7
    # Every npm PR touches pnpm-lock.yaml, so separate PRs conflict and get
    # rebased after each merge, and every rebase has to be verified again.
    # Minor and patch bumps of dev dependencies therefore come as one PR with
    # one lockfile. Majors and runtime dependencies (they ship to users and are
    # reviewed by hand) stay separate. Groups apply to version updates only:
    # security updates still arrive at once, one PR each.
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
    # Default is 5. Headroom for the PRs that stay separate: at the limit,
    # Dependabot silently stops opening any further PR, security ones included.
    open-pull-requests-limit: 10

  # The workflows pin every action to a commit SHA. Dependabot bumps the SHA
  # together with its version comment, so the pins don't quietly go stale.
  # Grouped into one PR: action bumps touch only workflow files and never
  # conflict with each other.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
