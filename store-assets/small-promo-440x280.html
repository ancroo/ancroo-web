<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .tile {
    width: 440px;
    height: 280px;
    background: linear-gradient(135deg, #1a4b7a 0%, #0f2d4a 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 48px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: white;
    position: relative;
    overflow: hidden;
  }

  .tile::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 240px;
    height: 240px;
    background: rgba(255,255,255,0.03);
    border-radius: 50%;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
  }

  .title {
    font-size: 39px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 27px;
    font-weight: 400;
    opacity: 0.9;
    line-height: 1.4;
    margin-bottom: 24px;
  }

  .steps {
    font-size: 20px;
    font-weight: 700;
    opacity: 0.75;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="tile">
    <div class="header">
      <img class="icon" src="../public/icon-128.png" alt="Ancroo">
      <div class="title">Ancroo</div>
    </div>
    <div class="subtitle">AI Prompt Launcher<br>for your Browser</div>
    <div class="steps">Point. Prompt. Done.</div>
  </div>
</body>
</html>
